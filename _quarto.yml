# Doing Research with AI Agents as a Quarto website on the dss-theme extension (quarto add IQSS/dss-theme).
# Chapters are generated from the upstream markdown; see AGENTS.md for the pipeline and the no-drift contract.
# Nothing executes: the source is prose and pre-built SVG figures.
# The render-time filter is generated by `just sync`; it strips authoring comments, points figure and
# in-document links at the right page, and turns section references into links. See AGENTS.md.
filters:
  - filters/site-filter.lua

# The filter's styling counterpart, generated alongside it by `just sync`.
format:
  dss-theme-html:
    css:
      - site.css
      - figures-dark.css
      # The console's colour tokens and part classes. The landing page links this itself; the
      # chapter pages need it too now that each one opens with a figure from the same parts kit.
      - console.css

project:
  type: dss-theme
  output-dir: _site
  render:
    - index.qmd
    - "chapters/*.qmd"

website:
  title: "Doing Research with AI Agents"
  # Cloudflare Pages, direct upload from `just deploy`. Behind Cloudflare Access while the
  # content is polished; it changes if the site ever moves to IQSS.
  site-url: https://dss-agentic-research.pages.dev
  repo-url: https://github.com/stevenworthington/dss-agentic-research
  page-navigation: true
  sidebar:
    style: floating
    search: true
    collapse-level: 1
    contents:
      - index.qmd
      # BEGIN chapters -- generated by split-chapters.py, do not edit
      - section: "Part I — Orientation"
        contents:
          - chapters/01-introduction.qmd
          - chapters/02-what-an-agent-is.qmd
          - chapters/03-where-to-run-it.qmd
          - chapters/04-modes.qmd
          - chapters/05-boundaries.qmd
      - section: "Part II — Teaching It Your Way"
        contents:
          - chapters/06-the-files-the-agent-reads.qmd
          - chapters/07-project-structure.qmd
          - chapters/08-repeatable-workflows.qmd
      - section: "Part III — The Work"
        contents:
          - chapters/09-bookkeeping.qmd
          - chapters/10-literature-search-and-synthesis.qmd
          - chapters/11-getting-data.qmd
          - chapters/12-analysis-simulation-first.qmd
          - chapters/13-verification.qmd
          - chapters/14-writing-revision-and-talks.qmd
          - chapters/15-reproducibility-and-hand-off.qmd
      - section: "Part IV — Judgment"
        contents:
          - chapters/16-data-confidentiality.qmd
          - chapters/17-cost-and-the-map.qmd
          - chapters/18-failure-modes-and-habits.qmd
      - section: "Appendices"
        contents:
          - chapters/appendix-a-starter-files.qmd
          - chapters/appendix-b-prompt-bank.qmd
          - chapters/appendix-c-the-terminal-in-two-pages.qmd
          - chapters/appendix-d-institutional-access-at-harvard.qmd
      # END chapters

# BEGIN chapter-map -- generated by split-chapters.py, do not edit
