# Doing Research with AI Agents as a Quarto website on the dss-theme extension (quarto add IQSS/dss-theme).
# Chapters are generated from the upstream markdown; see AGENTS.md for the pipeline and the no-drift contract.
# Nothing executes: the source is prose and pre-built SVG figures.
# The render-time filter is generated by `just sync`; it strips authoring comments, points figure and
# in-document links at the right page, and turns section references into links. See AGENTS.md.
filters:
  - filters/site-filter.lua

# The filter's styling counterpart, generated alongside it by `just sync`.
format:
  dss-theme-html:
    lightbox: true
    include-after-body: prompt-controls.html
    css:
      - site.css
      - figures-dark.css
      # The console's colour tokens and part classes. The landing page links this itself; the
      # chapter pages need it too now that each one opens with a figure from the same parts kit.
      - console.css

project:
  type: dss-theme
  output-dir: _site
  resources:
    - "resources/**"
  render:
    - index.qmd
    # Cloudflare Pages serves /404.html for any address it does not recognise. Without it Pages treats
    # the site as a single-page app and returns index.html with a 200, so a stale link silently shows
    # the landing page instead of saying the page is gone.
    - 404.qmd
    - "chapters/*.qmd"

website:
  title: "Doing Research with AI Agents"
  # Cloudflare Pages, direct upload from `just deploy`. Behind Cloudflare Access while the
  # content is polished; it changes if the site ever moves to IQSS.
  site-url: https://dss-agentic-research.pages.dev
  repo-url: https://github.com/stevenworthington/dss-agentic-research
  page-navigation: true
  sidebar:
    style: floating
    search: true
    collapse-level: 1
    contents:
      - index.qmd
      # BEGIN chapters -- generated by split-chapters.py, do not edit
      - section: "Part I — Orientation"
        contents:
          - chapters/research-uses.qmd
          - chapters/first-session.qmd
          - chapters/research-limits.qmd
          - chapters/agent-access.qmd
          - chapters/directing-work.qmd
      - section: "Part II — Direct The Work"
        contents:
          - chapters/project-organization.qmd
          - chapters/project-context.qmd
          - chapters/shared-conventions.qmd
          - chapters/reusable-procedures.qmd
      - section: "Part III — Do The Research"
        contents:
          - chapters/example-project.qmd
          - chapters/literature.qmd
          - chapters/data-acquisition.qmd
          - chapters/research-workflows.qmd
          - chapters/simulation.qmd
          - chapters/checking-analysis.qmd
          - chapters/llm-measurements.qmd
          - chapters/research-writing.qmd
          - chapters/research-handoff.qmd
      - section: "Reference"
        contents:
          - chapters/starter-files.qmd
          - chapters/prompt-index.qmd
          - chapters/troubleshooting.qmd
          - chapters/glossary.qmd
      # END chapters

