# Agentic AI for Researchers as a Quarto website on the dss-theme extension (quarto add IQSS/dss-theme).
# Chapters are generated from the upstream markdown; see AGENTS.md for the pipeline and the no-drift contract.
# Nothing executes: the source is prose and pre-built SVG figures.
project:
  type: dss-theme
  output-dir: _site
  render:
    - index.qmd
    - "chapters/*.qmd"

website:
  title: "Agentic AI for Researchers"
  # site-url: set when a public URL exists (Cloudflare Pages, then IQSS)
  repo-url: https://github.com/stevenworthington/dss-agentic-research
  page-navigation: true
  sidebar:
    style: floating
    search: true
    collapse-level: 1
    contents:
      - index.qmd
      # chapters are added here when the content pipeline runs (AGENTS.md)
